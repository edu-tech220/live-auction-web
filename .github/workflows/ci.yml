name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Tipos (TypeScript strict)
        run: npm run typecheck
      - name: Pruebas (Vitest + Testing Library)
        run: npm test
      - name: Build de producción
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagen
        run: docker build -t live-auction-web .
      - name: Smoke test (Nginx + fallback de SPA)
        run: |
          docker run -d -p 8080:80 --name web live-auction-web
          sleep 2
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          curl -fs http://localhost:8080/auctions/123 | grep -q '<div id="root">'
          docker rm -f web
